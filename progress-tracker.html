<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #000000;
      transition: all 0.2s;
      padding: 1.5rem;
    }

    body.dark-mode {
      background: #1a1a1a;
      color: #ffffff;
    }

    .container {
      width: 100%;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }

    .toggle-btn {
      border: 0.5px solid;
      border-color: #e0e0e0;
      background: transparent;
      color: inherit;
      padding: 4px 8px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    body.dark-mode .toggle-btn {
      border-color: #444444;
    }

    .toggle-btn:hover {
      background: #f0f0f0;
    }

    body.dark-mode .toggle-btn:hover {
      background: #444444;
    }

    .progress-section {
      display: grid;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .progress-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .progress-label {
      font-size: 14px;
      font-weight: 500;
      min-width: 45px;
      flex-shrink: 0;
    }

    .progress-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-percent {
      font-size: 12px;
      color: #666666;
      min-width: 32px;
      text-align: right;
      flex-shrink: 0;
    }

    body.dark-mode .progress-percent {
      color: #999999;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      border: 0.5px solid #e0e0e0;
    }

    body.dark-mode .progress-bar {
      background: #333333;
      border-color: #444444;
    }

    .progress-fill {
      height: 100%;
      background: #333333;
      border-radius: 12px;
      transition: width 0.3s ease;
    }

    body.dark-mode .progress-fill {
      background: #cccccc;
    }

    .config-section {
      border-top: 0.5px solid #e0e0e0;
      padding-top: 1rem;
      max-height: 500px;
      overflow: hidden;
      transition: max-height 0.3s ease, padding-top 0.3s ease, opacity 0.3s ease;
      opacity: 1;
    }

    .config-section.hidden {
      max-height: 0;
      padding-top: 0;
      opacity: 0;
      border-top: none;
    }

    body.dark-mode .config-section {
      border-color: #444444;
    }

    .config-title {
      font-size: 13px;
      font-weight: 500;
      margin: 0 0 0.75rem 0;
      color: #666666;
    }

    body.dark-mode .config-title {
      color: #999999;
    }

    .config-grid {
      display: grid;
      gap: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    input[type="date"],
    select {
      padding: 8px 12px;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      background: #f0f0f0;
      color: inherit;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s;
    }

    body.dark-mode input[type="date"],
    body.dark-mode select {
      border-color: #444444;
      background: #333333;
    }

    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #333333;
    }

    body.dark-mode input[type="date"]:focus,
    body.dark-mode select:focus {
      border-color: #cccccc;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .option-btn {
      padding: 8px 12px;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: capitalize;
    }

    body.dark-mode .option-btn {
      border-color: #444444;
    }

    .option-btn:hover:not(.active) {
      background: #f0f0f0;
    }

    body.dark-mode .option-btn:hover:not(.active) {
      background: #444444;
    }

    .option-btn.active {
      background: #333333;
      color: #ffffff;
      font-weight: 500;
      border-color: #333333;
    }

    body.dark-mode .option-btn.active {
      background: #cccccc;
      color: #1a1a1a;
      border-color: #cccccc;
    }


  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h2>Daily 1%</h2>
      <div style="display: flex; gap: 8px;">
        <button class="toggle-btn" id="settingsToggle">⚙</button>
        <button class="toggle-btn" id="modeToggle">🌙</button>
      </div>
    </div>

    <!-- Progress bars -->
    <div class="progress-section" id="progressSection"></div>

    <!-- Configuration -->
    <div class="config-section hidden">
      <h3 class="config-title">Configuration</h3>
      
      <div class="config-grid">
        <!-- Start Date -->
        <div class="form-group">
          <label class="form-label" for="startDate">Start date</label>
          <input type="date" id="startDate" value="2026-01-01">
        </div>

        <!-- Timezone -->
        <div class="form-group">
          <label class="form-label" for="timezone">Timezone</label>
          <select id="timezone">
            <option value="UTC">UTC</option>
            <option value="EST">EST</option>
            <option value="CST">CST</option>
            <option value="MST">MST</option>
            <option value="PST">PST</option>
            <option value="GMT">GMT</option>
            <option value="CET">CET</option>
            <option value="JST">JST</option>
            <option value="AEST">AEST</option>
          </select>
        </div>

        <!-- Week Start -->
        <div class="form-group">
          <label class="form-label">Week starts on</label>
          <div class="button-group">
            <button class="option-btn active" data-week="monday">Monday</button>
            <button class="option-btn" data-week="sunday">Sunday</button>
          </div>
        </div>
      </div>
    </div>


  </div>

  <script>
    let isDarkMode = false;
    let weekStart = 'monday';
    let showSettings = false;

    const modeToggle = document.getElementById('modeToggle');
    const settingsToggle = document.getElementById('settingsToggle');
    const configSection = document.querySelector('.config-section');
    const startDateInput = document.getElementById('startDate');
    const timezoneSelect = document.getElementById('timezone');
    const progressSection = document.getElementById('progressSection');
    const weekButtons = document.querySelectorAll('[data-week]');

    // Settings toggle
    settingsToggle.addEventListener('click', () => {
      showSettings = !showSettings;
      configSection.classList.toggle('hidden');
    });

    // Mode toggle
    modeToggle.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle('dark-mode');
      modeToggle.textContent = isDarkMode ? '☀' : '🌙';
    });

    // Week start toggle
    weekButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        weekButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        weekStart = btn.dataset.week;
        updateProgress();
      });
    });

    // Input changes
    startDateInput.addEventListener('change', updateProgress);
    timezoneSelect.addEventListener('change', updateProgress);

    function calculateProgress() {
      const now = new Date();

      // Day progress
      const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const dayProgress = Math.min(100, Math.max(0, ((now - dayStart) / (dayEnd - dayStart)) * 100));

      // Week progress
      const getWeekStart = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const dayOffset = weekStart === 'monday' ? (day === 0 ? 6 : day - 1) : day;
        d.setDate(d.getDate() - dayOffset);
        d.setHours(0, 0, 0, 0);
        return d;
      };
      const weekStartDate = getWeekStart(now);
      const weekEndDate = new Date(weekStartDate);
      weekEndDate.setDate(weekEndDate.getDate() + 7);
      const weekProgress = Math.min(100, Math.max(0, ((now - weekStartDate) / (weekEndDate - weekStartDate)) * 100));

      // Month progress
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const monthProgress = Math.min(100, Math.max(0, ((now - monthStart) / (monthEnd - monthStart)) * 100));

      // Year progress
      const yearStart = new Date(now.getFullYear(), 0, 1);
      const yearEnd = new Date(now.getFullYear() + 1, 0, 1);
      const yearProgress = Math.min(100, Math.max(0, ((now - yearStart) / (yearEnd - yearStart)) * 100));

      return {
        day: Math.round(dayProgress),
        week: Math.round(weekProgress),
        month: Math.round(monthProgress),
        year: Math.round(yearProgress)
      };
    }

    function updateProgress() {
      const progress = calculateProgress();
      const periods = [
        { label: 'Day', value: progress.day },
        { label: 'Week', value: progress.week },
        { label: 'Month', value: progress.month },
        { label: 'Year', value: progress.year }
      ];

      progressSection.innerHTML = periods.map(period => `
        <div class="progress-item">
          <span class="progress-label">${period.label}</span>
          <div class="progress-content">
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${period.value}%"></div>
            </div>
          </div>
          <span class="progress-percent">${period.value}%</span>
        </div>
      `).join('');
    }

    // Initial render
    updateProgress();

    // Update every second
    setInterval(updateProgress, 1000);
  </script>
</body>
</html>
